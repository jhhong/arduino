<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <!--
    Arduino Nano 결선도 (논리 배선도 - 실제 부품 배치가 아님)
    이 그림의 원본은 wiring.md 의 표다. 핀을 바꾸면 둘 다 고칠 것.

    GitHub 는 다크 모드에서도 SVG 배경을 칠해주지 않으므로,
    배경 사각형을 명시적으로 그려서 어느 테마에서나 읽히게 한다.
  -->
  <rect width="960" height="660" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="659" fill="none" stroke="#d0d7de"/>

  <text x="28" y="42" font-size="21" font-weight="700" fill="#1f2328">Arduino Nano — MINI GAMES 결선도</text>
  <text x="28" y="64" font-size="13" fill="#57606a">논리 배선도입니다. 실제 부품 배치나 브레드보드 형태가 아닙니다. 원본 표: wiring.md</text>

  <!-- ================= Arduino Nano ================= -->
  <rect x="380" y="110" width="200" height="470" rx="10" fill="#0f6b62"/>
  <text x="480" y="140" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Arduino Nano</text>
  <text x="480" y="158" font-size="11" fill="#a9d9d3" text-anchor="middle">ATmega328P · 5V</text>

  <!-- 왼쪽 핀 (디지털) -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">
    <rect x="380" y="185" width="52" height="20" fill="#0a534c"/><text x="388" y="199">D13</text>
    <rect x="380" y="225" width="52" height="20" fill="#0a534c"/><text x="388" y="239">D11</text>
    <rect x="380" y="265" width="52" height="20" fill="#0a534c"/><text x="388" y="279">D10</text>
    <rect x="380" y="305" width="52" height="20" fill="#0a534c"/><text x="388" y="319">D9</text>
    <rect x="380" y="345" width="52" height="20" fill="#0a534c"/><text x="388" y="359">D8</text>
    <rect x="380" y="425" width="52" height="20" fill="#0a534c"/><text x="388" y="439">D7</text>
    <rect x="380" y="505" width="52" height="20" fill="#0a534c"/><text x="388" y="519">D2</text>
  </g>

  <!-- 오른쪽 핀 (아날로그/전원) -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">
    <rect x="528" y="225" width="52" height="20" fill="#0a534c"/><text x="572" y="239">A0</text>
    <rect x="528" y="265" width="52" height="20" fill="#0a534c"/><text x="572" y="279">A1</text>
    <rect x="528" y="435" width="52" height="20" fill="#8a5a00"/><text x="572" y="449">3V3</text>
    <rect x="528" y="470" width="52" height="20" fill="#8a2622"/><text x="572" y="484">5V</text>
    <rect x="528" y="505" width="52" height="20" fill="#33383d"/><text x="572" y="519">GND</text>
  </g>

  <text x="480" y="560" font-size="10" fill="#a9d9d3" text-anchor="middle">D3~D6 · D12 · A2~A7 미사용</text>

  <!-- ================= TFT LCD ================= -->
  <rect x="60" y="150" width="215" height="215" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <rect x="60" y="150" width="215" height="26" rx="8" fill="#1f6feb"/>
  <rect x="60" y="168" width="215" height="8" fill="#1f6feb"/>
  <text x="167" y="168" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">TFT LCD · ST7735</text>
  <g font-size="12" fill="#1f2328" text-anchor="end">
    <text x="258" y="199">SCK / SCL</text>
    <text x="258" y="239">SDA / MOSI</text>
    <text x="258" y="279">CS</text>
    <text x="258" y="319">DC / A0 / RS</text>
    <text x="258" y="359">RES / RST</text>
  </g>
  <text x="72" y="199" font-size="11" fill="#57606a">128 x 160</text>
  <text x="72" y="219" font-size="11" fill="#57606a">하드웨어 SPI</text>
  <text x="72" y="332" font-size="10" fill="#cf222e">VCC → 5V</text>
  <text x="72" y="345" font-size="10" fill="#9a6700">LED → 3.3V (백라이트)</text>
  <text x="72" y="358" font-size="10" fill="#57606a">GND → GND</text>

  <!-- TFT 신호선 -->
  <g stroke-width="2.5" fill="none">
    <path d="M275 195 H 380" stroke="#1f6feb"/>
    <path d="M275 235 H 380" stroke="#1f6feb"/>
    <path d="M275 275 H 380" stroke="#1f6feb"/>
    <path d="M275 315 H 380" stroke="#1f6feb"/>
    <path d="M275 355 H 380" stroke="#1f6feb"/>
  </g>
  <g font-size="10" fill="#0969da" text-anchor="middle">
    <text x="327" y="190">SPI CLK</text>
    <text x="327" y="230">SPI DATA</text>
  </g>

  <!-- ================= 부저 ================= -->
  <rect x="60" y="400" width="215" height="70" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <rect x="60" y="400" width="215" height="26" rx="8" fill="#bf8700"/>
  <rect x="60" y="418" width="215" height="8" fill="#bf8700"/>
  <text x="167" y="418" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">부저 (수동형)</text>
  <text x="258" y="449" font-size="12" fill="#1f2328" text-anchor="end">+ / I/O</text>
  <text x="72" y="449" font-size="10" fill="#57606a">tone() · Timer2</text>
  <path d="M275 445 H 350 V 435 H 380" stroke="#bf8700" stroke-width="2.5" fill="none"/>

  <!-- ================= 버튼 ================= -->
  <rect x="60" y="495" width="215" height="70" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <rect x="60" y="495" width="215" height="26" rx="8" fill="#6e40c9"/>
  <rect x="60" y="513" width="215" height="8" fill="#6e40c9"/>
  <text x="167" y="513" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">푸시 버튼</text>
  <text x="258" y="544" font-size="12" fill="#1f2328" text-anchor="end">한쪽 단자</text>
  <text x="72" y="544" font-size="10" fill="#57606a">INPUT_PULLUP</text>
  <text x="72" y="557" font-size="10" fill="#57606a">외부 저항 불필요</text>
  <path d="M275 540 H 350 V 515 H 380" stroke="#6e40c9" stroke-width="2.5" fill="none"/>

  <!-- ================= 조이스틱 ================= -->
  <rect x="685" y="180" width="215" height="150" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <rect x="685" y="180" width="215" height="26" rx="8" fill="#1a7f37"/>
  <rect x="685" y="198" width="215" height="8" fill="#1a7f37"/>
  <text x="792" y="198" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">조이스틱 (아날로그 2축)</text>
  <g font-size="12" fill="#1f2328" text-anchor="start">
    <text x="702" y="239">VRx</text>
    <text x="702" y="279">VRy</text>
  </g>
  <text x="702" y="305" font-size="10" fill="#57606a">SW 미사용 (D2 로 버튼 대체 가능)</text>
  <text x="702" y="320" font-size="10" fill="#57606a">부팅 시 중립값 자동 보정</text>
  <g stroke="#1a7f37" stroke-width="2.5" fill="none">
    <path d="M685 235 H 580"/>
    <path d="M685 275 H 580"/>
  </g>

  <!-- ================= 전원 ================= -->
  <rect x="685" y="400" width="215" height="185" rx="8" fill="#fff8f5" stroke="#cf222e" stroke-dasharray="5 3"/>
  <text x="792" y="424" font-size="13" font-weight="700" fill="#cf222e" text-anchor="middle">전원</text>
  <g font-size="11" fill="#1f2328">
    <text x="700" y="449">TFT LED (백라이트)</text>
    <text x="700" y="484">TFT VCC · 조이스틱 · 부저 +</text>
    <text x="700" y="519">모든 모듈 GND</text>
  </g>
  <path d="M685 445 H 580" stroke="#9a6700" stroke-width="2.5" fill="none"/>
  <path d="M685 480 H 580" stroke="#cf222e" stroke-width="2.5" fill="none"/>
  <path d="M685 515 H 580" stroke="#33383d" stroke-width="2.5" fill="none"/>
  <text x="700" y="547" font-size="10" fill="#9a6700">LED 를 연결하지 않으면 화면이</text>
  <text x="700" y="561" font-size="10" fill="#9a6700">어두워서 보이지 않습니다.</text>
  <text x="700" y="578" font-size="10" fill="#cf222e">3.3V 핀은 USB 칩에서 나오며 50mA 정도가 한계</text>

  <!-- ================= 범례 ================= -->
  <g font-size="11">
    <text x="28" y="612" font-weight="700" fill="#1f2328">범례</text>
    <line x1="72" y1="608" x2="102" y2="608" stroke="#1f6feb" stroke-width="2.5"/>
    <text x="108" y="612" fill="#57606a">SPI / 디스플레이</text>
    <line x1="212" y1="608" x2="242" y2="608" stroke="#1a7f37" stroke-width="2.5"/>
    <text x="248" y="612" fill="#57606a">아날로그 입력</text>
    <line x1="342" y1="608" x2="372" y2="608" stroke="#6e40c9" stroke-width="2.5"/>
    <text x="378" y="612" fill="#57606a">디지털 입력</text>
    <line x1="462" y1="608" x2="492" y2="608" stroke="#bf8700" stroke-width="2.5"/>
    <text x="498" y="612" fill="#57606a">디지털 출력</text>
    <line x1="582" y1="608" x2="612" y2="608" stroke="#cf222e" stroke-width="2.5"/>
    <text x="618" y="612" fill="#57606a">5V</text>
    <line x1="655" y1="608" x2="685" y2="608" stroke="#9a6700" stroke-width="2.5"/>
    <text x="691" y="612" fill="#57606a">3.3V</text>
    <line x1="740" y1="608" x2="770" y2="608" stroke="#33383d" stroke-width="2.5"/>
    <text x="776" y="612" fill="#57606a">GND</text>
  </g>
  <text x="28" y="638" font-size="10" fill="#8c959f">D11(MOSI) 과 D13(SCK) 은 하드웨어 SPI 핀이라 변경할 수 없습니다. D12(MISO) 는 쓰지 않습니다.</text>
</svg>
